services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-jain}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jain}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-jain}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_SECRET: ${AUTH_SECRET:-}
      OTP_DELIVERY: ${OTP_DELIVERY:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jain}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-jain}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_SECRET: ${AUTH_SECRET:-}
      OTP_DELIVERY: ${OTP_DELIVERY:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_files:/project/storage/private
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  private_files:
